<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通用 CS 练习</title>
<style>
  :root {
    --bg: #f7f7f8;
    --card: #ffffff;
    --border: #e4e4e7;
    --text: #18181b;
    --muted: #71717a;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --correct: #16a34a;
    --correct-bg: #dcfce7;
    --correct-border: #86efac;
    --wrong: #dc2626;
    --wrong-bg: #fee2e2;
    --wrong-border: #fca5a5;
    --kb-tag: #2563eb;
    --cs-tag: #9333ea;
    --explanation-bg: #fafafa;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    line-height: 1.6;
    padding: 24px 16px 120px;
  }
  .container { max-width: 820px; margin: 0 auto; }
  header h1 { font-size: 22px; margin: 0 0 4px; }
  header .meta { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

  .result-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 22px;
    margin-bottom: 24px;
    display: none;
  }
  .result-card.show { display: block; }
  .result-card h2 { margin: 0 0 6px; font-size: 18px; }
  .result-card .score { font-size: 36px; font-weight: 700; color: var(--primary); line-height: 1.1; margin: 6px 0; }
  .result-card .score.low { color: var(--wrong); }
  .result-card .score.high { color: var(--correct); }
  .result-card .breakdown { font-size: 13px; color: var(--muted); }

  .question-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 16px;
    transition: border-color 0.15s, background 0.15s;
  }
  .question-card.correct { border-color: var(--correct-border); }
  .question-card.wrong { border-color: var(--wrong-border); background: #fff7f7; }

  .question-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    font-size: 13px;
    color: var(--muted);
  }
  .tag {
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    color: white;
    letter-spacing: 0.02em;
  }
  .tag.kb { background: var(--kb-tag); }
  .tag.cs { background: var(--cs-tag); }
  .question-number { font-weight: 600; color: var(--text); }
  .question-text {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 14px;
    word-break: break-word;
  }
  .question-text code,
  .options code,
  .explanation code {
    background: #f4f4f5;
    padding: 1px 6px;
    border-radius: 4px;
    font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
    font-size: 0.92em;
  }

  .options { list-style: none; padding: 0; margin: 0; }
  .options li {
    padding: 10px 14px;
    margin: 6px 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    transition: background 0.1s, border-color 0.1s;
  }
  .options li:hover:not(.locked) { background: #f4f4f5; }
  .options li.selected { border-color: var(--primary); background: #eff6ff; }
  .options li.locked { cursor: default; }
  .options li.correct-option { border-color: var(--correct); background: var(--correct-bg); }
  .options li.wrong-option { border-color: var(--wrong); background: var(--wrong-bg); }
  .options li.wrong-option .option-text { text-decoration: line-through; }
  .options input[type=radio] { margin-top: 4px; }
  .option-letter { font-weight: 600; color: var(--muted); min-width: 18px; }
  .options li.correct-option .option-letter { color: var(--correct); }
  .options li.wrong-option .option-letter { color: var(--wrong); }
  .option-text { flex: 1; word-break: break-word; }
  .verdict {
    margin-left: auto;
    font-size: 12px;
    font-weight: 600;
  }
  .verdict.correct { color: var(--correct); }
  .verdict.wrong { color: var(--wrong); }

  .explanation {
    display: none;
    margin-top: 14px;
    padding: 12px 14px;
    background: var(--explanation-bg);
    border-left: 3px solid var(--primary);
    border-radius: 0 6px 6px 0;
    font-size: 13px;
  }
  .explanation.show { display: block; }
  .explanation .label {
    font-weight: 700;
    margin-bottom: 4px;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .explanation .source-ref {
    display: block;
    margin-top: 8px;
    font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
    font-size: 11.5px;
    color: var(--muted);
    word-break: break-all;
  }

  /* ── 名词解释 ── */
  .glossary-section {
    display: none;
    margin-top: 14px;
    padding: 12px 14px;
    background: #fffbeb;
    border-left: 3px solid #f59e0b;
    border-radius: 0 6px 6px 0;
    font-size: 13px;
  }
  .glossary-section.show { display: block; }
  .glossary-section .label {
    font-weight: 700;
    margin-bottom: 8px;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: #92400e;
    text-transform: uppercase;
  }
  .glossary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 8px;
  }
  .glossary-item {
    background: #fff;
    border: 1px solid #fde68a;
    border-radius: 6px;
    padding: 8px 10px;
  }
  .glossary-item .term {
    font-weight: 700;
    color: #b45309;
    font-size: 12.5px;
    font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
  }
  .glossary-item .term-def {
    color: var(--text);
    font-size: 12px;
    margin-top: 2px;
    line-height: 1.5;
  }

  /* ── 逐步解析 ── */
  .steps-section {
    display: none;
    margin-top: 14px;
    padding: 12px 14px;
    background: #f0fdf4;
    border-left: 3px solid #22c55e;
    border-radius: 0 6px 6px 0;
    font-size: 13px;
  }
  .steps-section.show { display: block; }
  .steps-section .label {
    font-weight: 700;
    margin-bottom: 10px;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: #166534;
    text-transform: uppercase;
  }
  .step-item {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }
  .step-item:last-child { margin-bottom: 0; }
  .step-number {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    background: #22c55e;
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    margin-top: 1px;
  }
  .step-body { flex: 1; }
  .step-text { color: var(--text); line-height: 1.55; }
  .step-text code {
    background: #dcfce7;
    padding: 1px 5px;
    border-radius: 4px;
    font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
    font-size: 0.92em;
    color: #166534;
  }
  .diagram {
    margin-top: 7px;
    background: #18181b;
    color: #86efac;
    border-radius: 6px;
    padding: 10px 12px;
    font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
    font-size: 11.5px;
    line-height: 1.6;
    overflow-x: auto;
    white-space: pre;
  }

  /* ── 背景介绍 ── */
  .background-section {
    display: none;
    margin-top: 14px;
    padding: 12px 14px;
    background: #f5f3ff;
    border-left: 3px solid #7c3aed;
    border-radius: 0 6px 6px 0;
    font-size: 13px;
  }
  .background-section.show { display: block; }
  .background-section .label {
    font-weight: 700;
    margin-bottom: 6px;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: #5b21b6;
    text-transform: uppercase;
  }
  .background-section .bg-text {
    color: var(--text);
    line-height: 1.65;
  }

  .submit-bar {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: 16px;
    max-width: 820px;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
  }
  .progress { font-size: 13px; color: var(--muted); }
  button.submit {
    background: var(--primary);
    color: white;
    border: none;
    padding: 9px 22px;
    font-size: 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
  }
  button.submit:disabled { opacity: 0.45; cursor: not-allowed; }
  button.submit:hover:not(:disabled) { background: var(--primary-hover); }

  @media (max-width: 600px) {
    body { padding: 16px 12px 110px; }
    .question-card { padding: 14px 14px; }
    header h1 { font-size: 18px; }
    .glossary-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1 id="exam-title">通用 CS 练习</h1>
    <div class="meta" id="exam-meta"></div>
  </header>

  <div class="result-card" id="result-card">
    <h2>测验结果</h2>
    <div class="score" id="result-score">— / —</div>
    <div class="breakdown" id="result-breakdown"></div>
  </div>

  <div id="questions-root"></div>
</div>

<div class="submit-bar">
  <div class="progress" id="progress">已作答 0 / 0</div>
  <button class="submit" id="submit-btn" disabled>提交答案</button>
</div>

    },
    {

      "subcategory": "system-design",
      "question": "关于消息系统的 at-least-once 投递语义, 以下哪项是**消费者**必须承担的责任?",
      "options": [

      "source_ref": null,
      "background": "分布式消息系统面临「可靠投递」与「实现复杂度」的根本权衡。at-most-once（先 commit 再处理）实现简单但可能丢消息；exactly-once（恰好一次）需要生产者幂等 + 消费者事务，实现复杂且有性能损耗。at-least-once（先处理再 commit）是最常见的工程折衷：Broker 保证消息不丢，允许重复投递，将「去重」职责下推给消费者——消费者可以用幂等操作或去重表来达到「恰好一次效果」。Kafka、RabbitMQ、RocketMQ 等主流消息系统的默认语义均为 at-least-once。",
      "glossary": [
        {"term": "at-least-once", "def": "消息投递语义：保证每条消息至少被投递一次，可能重复，但不会丢失；消费者需自行处理重复"},
        {"term": "at-most-once", "def": "消息投递语义：每条消息最多投递一次，可能丢失但不会重复；先 commit 再处理，若处理期间崩溃则消息丢失"},

        {"term": "幂等 (Idempotent)", "def": "操作执行多次与执行一次效果相同；如 SET x=5（幂等）vs x+=1（非幂等）；天然幂等的操作无需去重"},
        {"term": "去重 (Deduplication)", "def": "通过 message-id 等唯一标识检测并跳过已处理的重复消息；通常用去重表（Redis/DB）记录已处理的 ID"},
        {"term": "message-id", "def": "消息的全局唯一标识符，由 producer 或 broker 生成；消费者用它来识别是否已经处理过该消息"},
        {"term": "consumer group rebalance", "def": "Kafka 消费者组成员变化时（新增/宕机）触发的分区重新分配；rebalance 期间可能重复投递部分消息"}

        },
        {
          "text": "方案1 — 幂等操作（业务天然安全）",
          "diagram": "幂等 vs 非幂等:\n\n幂等操作 (多次执行 = 一次执行):\n  「设置用户状态为 ACTIVATED」     ← 重复执行结果相同 ✓\n  「将订单状态更新为 PAID」         ← 已是PAID则跳过 ✓\n  「INSERT ... ON DUPLICATE IGNORE」 ← 重复插入被忽略 ✓\n\n非幂等操作 (必须额外去重):\n  「账户余额 += 100」               ← 重复执行多扣！\n  「发送短信给用户」                ← 重复执行多发！\n  「创建订单」                       ← 重复执行多建！"
        },
        {
          "text": "方案2 — 显式去重表",
          "diagram": "去重表设计:\n\n┌─────────────────────────────────────────┐\n│ 去重表 (dedupe_log)                      │\n│ message_id VARCHAR PK | processed_at     │\n├─────────────────────────────────────────┤\n│ order-789            | 2026-06-18 10:00  │\n└─────────────────────────────────────────┘\n\n消费者处理逻辑:\n  def handle(msg):\n    if dedupe_table.exists(msg.id):\n      return  # 已处理，跳过\n    \n    with transaction:\n      do_business_logic(msg)       # 执行业务\n      dedupe_table.insert(msg.id)  # 记录已处理（同一事务）\n\n注意: 业务操作和去重记录必须在同一事务中，否则仍有竞争！"

<script>
(function () {
  "use strict";

  const dataEl = document.getElementById('exam-data');
  const exam = JSON.parse(dataEl.textContent);
  const root = document.getElementById('questions-root');
  const titleEl = document.getElementById('exam-title');
  const metaEl = document.getElementById('exam-meta');
  const progressEl = document.getElementById('progress');
  const submitBtn = document.getElementById('submit-btn');
  const resultCard = document.getElementById('result-card');
  const resultScore = document.getElementById('result-score');
  const resultBreakdown = document.getElementById('result-breakdown');

  const total = exam.questions.length;
  const userAnswers = new Array(total).fill(null);
  let submitted = false;

  titleEl.textContent = exam.title || '通用 CS 练习';
  metaEl.textContent = '生成于 ' + (exam.generated_at || '') + ' · 共 ' + total + ' 题 · 提交前可自由修改答案';
  progressEl.textContent = '已作答 0 / ' + total;

  function escapeHTML(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  function renderInlineCode(text) {
    if (text == null) return '';
    const parts = String(text).split(/(`[^`]+`)/g);
    return parts.map(function (part) {
      if (part.length >= 2 && part[0] === '`' && part[part.length - 1] === '`') {
        return '<code>' + escapeHTML(part.slice(1, -1)) + '</code>';
      }
      return escapeHTML(part);
    }).join('');
  }

  // Render **bold** and `code` in step text
  function renderStepText(text) {
    if (text == null) return '';
    // First escape, then un-escape for markdown patterns
    let s = escapeHTML(text);
    // **bold**
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    // `code`
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    return s;
  }

  exam.questions.forEach(function (q, idx) {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = 'q-' + idx;

    const isKB = q.category === 'knowledge-base';
    const tagClass = isKB ? 'kb' : 'cs';
    const tagText = isKB ? '知识库' : '通用 CS';
    const subText = q.subcategory ? ' · ' + escapeHTML(q.subcategory) : '';

    let optionsHTML = '';
    q.options.forEach(function (opt, i) {
      optionsHTML += ''
        + '<li data-idx="' + i + '">'
        +   '<input type="radio" name="q-' + idx + '" value="' + i + '" id="q-' + idx + '-opt-' + i + '">'
        +   '<span class="option-letter">' + String.fromCharCode(65 + i) + '.</span>'
        +   '<label class="option-text" for="q-' + idx + '-opt-' + i + '">' + renderInlineCode(opt) + '</label>'
        +   '<span class="verdict" data-verdict-for="' + i + '"></span>'
        + '</li>';
    });

    // Glossary section
    let glossaryHTML = '';
    if (q.glossary && q.glossary.length > 0) {
      let items = q.glossary.map(function (g) {
        return '<div class="glossary-item">'
          + '<div class="term">' + escapeHTML(g.term) + '</div>'
          + '<div class="term-def">' + escapeHTML(g.def) + '</div>'
          + '</div>';
      }).join('');
      glossaryHTML = '<div class="glossary-section" id="glo-' + idx + '">'
        + '<div class="label">名词解释</div>'
        + '<div class="glossary-grid">' + items + '</div>'
        + '</div>';
    }

    // Steps section
    let stepsHTML = '';
    if (q.steps && q.steps.length > 0) {
      let stepsInner = q.steps.map(function (step, si) {
        let diagramHTML = step.diagram
          ? '<pre class="diagram">' + escapeHTML(step.diagram) + '</pre>'
          : '';
        return '<div class="step-item">'
          + '<div class="step-number">' + (si + 1) + '</div>'
          + '<div class="step-body">'
          + '<div class="step-text">' + renderStepText(step.text) + '</div>'
          + diagramHTML
          + '</div>'
          + '</div>';
      }).join('');
      stepsHTML = '<div class="steps-section" id="steps-' + idx + '">'
        + '<div class="label">逐步解析</div>'
        + stepsInner
        + '</div>';
    }

    let backgroundHTML = '';
    if (q.background) {
      backgroundHTML = '<div class="background-section" id="bg-' + idx + '">'
        + '<div class="label">背景介绍</div>'
        + '<div class="bg-text">' + escapeHTML(q.background) + '</div>'
        + '</div>';
    }

    const explanationHTML = ''
      + '<div class="explanation" id="exp-' + idx + '">'
      +   '<div class="label">解析</div>'
      +   '<div class="exp-body">' + renderInlineCode(q.explanation) + '</div>'
      +   (q.source_ref ? '<span class="source-ref">来源:' + escapeHTML(q.source_ref) + '</span>' : '')
      + '</div>'
      + backgroundHTML
      + glossaryHTML
      + stepsHTML;

    card.innerHTML = ''
      + '<div class="question-header">'
      +   '<span class="tag ' + tagClass + '">' + tagText + '</span>'
      +   '<span class="question-number">第 ' + (idx + 1) + ' 题</span>'
      +   '<span>' + subText + '</span>'
      + '</div>'
      + '<div class="question-text">' + renderInlineCode(q.question) + '</div>'
      + '<ul class="options">' + optionsHTML + '</ul>'
      + explanationHTML;

    root.appendChild(card);

    card.querySelectorAll('.options li').forEach(function (li) {
      li.addEventListener('click', function () {
        if (submitted) return;
        const input = li.querySelector('input[type=radio]');
        if (!input) return;
        input.checked = true;
        userAnswers[idx] = parseInt(input.value, 10);
        card.querySelectorAll('.options li').forEach(function (other) {
          other.classList.remove('selected');
        });
        li.classList.add('selected');
        updateProgress();
      });
    });
  });

  function updateProgress() {
    const answered = userAnswers.filter(function (a) { return a !== null; }).length;
    progressEl.textContent = '已作答 ' + answered + ' / ' + total;
    submitBtn.disabled = answered !== total;
  }

  submitBtn.addEventListener('click', function () {
    if (submitted) return;
    submitted = true;
    submitBtn.disabled = true;
    submitBtn.textContent = '已提交';

    let correctCount = 0;
    let kbCorrect = 0, kbTotal = 0, csCorrect = 0, csTotal = 0;

    exam.questions.forEach(function (q, idx) {
      const card = document.getElementById('q-' + idx);
      const userAns = userAnswers[idx];
      const isCorrect = userAns === q.correct;
      if (isCorrect) correctCount++;
      if (q.category === 'knowledge-base') {
        kbTotal++;
        if (isCorrect) kbCorrect++;
      } else {
        csTotal++;
        if (isCorrect) csCorrect++;
      }

      card.classList.add(isCorrect ? 'correct' : 'wrong');
      card.querySelectorAll('.options li').forEach(function (li) {
        const i = parseInt(li.getAttribute('data-idx'), 10);
        const input = li.querySelector('input[type=radio]');
        if (input) input.disabled = true;
        li.classList.add('locked');
        const verdict = li.querySelector('.verdict');
        if (i === q.correct) {
          li.classList.add('correct-option');
          if (verdict) {
            verdict.classList.add('correct');
            verdict.textContent = '✓ 正确答案';
          }
        }
        if (i === userAns && !isCorrect) {
          li.classList.add('wrong-option');
          if (verdict) {
            verdict.classList.add('wrong');
            verdict.textContent = '✗ 你的选择';
          }
        }
      });

      document.getElementById('exp-' + idx).classList.add('show');

      const bgEl = document.getElementById('bg-' + idx);
      if (bgEl) bgEl.classList.add('show');

      const gloEl = document.getElementById('glo-' + idx);
      if (gloEl) gloEl.classList.add('show');

      const stepsEl = document.getElementById('steps-' + idx);
      if (stepsEl) stepsEl.classList.add('show');
    });

    resultScore.textContent = correctCount + ' / ' + total;
    const ratio = correctCount / total;
    if (ratio >= 0.8) resultScore.classList.add('high');
    else if (ratio < 0.5) resultScore.classList.add('low');

    const breakdownParts = [];
    if (kbTotal > 0) breakdownParts.push('知识库 ' + kbCorrect + '/' + kbTotal);
    if (csTotal > 0) breakdownParts.push('通用 CS ' + csCorrect + '/' + csTotal);
    resultBreakdown.textContent = breakdownParts.join(' · ');

    resultCard.classList.add('show');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();
</script>
</body>
</html>
