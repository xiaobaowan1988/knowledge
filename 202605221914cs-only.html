<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通用 CS 练习</title>
<style>
  :root {
    --bg: #f7f7f8;
    --card: #ffffff;
    --border: #e4e4e7;
    --text: #18181b;
    --muted: #71717a;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --correct: #16a34a;
    --correct-bg: #dcfce7;
    --correct-border: #86efac;
    --wrong: #dc2626;
    --wrong-bg: #fee2e2;
    --wrong-border: #fca5a5;
    --kb-tag: #2563eb;
    --cs-tag: #9333ea;
    --explanation-bg: #fafafa;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    line-height: 1.6;
    padding: 24px 16px 120px;
  }
  .container { max-width: 820px; margin: 0 auto; }
  header h1 { font-size: 22px; margin: 0 0 4px; }
  header .meta { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

  .result-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 22px;
    margin-bottom: 24px;
    display: none;
  }
  .result-card.show { display: block; }
  .result-card h2 { margin: 0 0 6px; font-size: 18px; }
  .result-card .score { font-size: 36px; font-weight: 700; color: var(--primary); line-height: 1.1; margin: 6px 0; }
  .result-card .score.low { color: var(--wrong); }
  .result-card .score.high { color: var(--correct); }
  .result-card .breakdown { font-size: 13px; color: var(--muted); }

  .question-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 16px;
    transition: border-color 0.15s, background 0.15s;
  }
  .question-card.correct { border-color: var(--correct-border); }
  .question-card.wrong { border-color: var(--wrong-border); background: #fff7f7; }

  .question-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    font-size: 13px;
    color: var(--muted);
  }
  .tag {
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    color: white;
    letter-spacing: 0.02em;
  }
  .tag.kb { background: var(--kb-tag); }
  .tag.cs { background: var(--cs-tag); }
  .question-number { font-weight: 600; color: var(--text); }
  .question-text {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 14px;
    word-break: break-word;
  }
  .question-text code,
  .options code,
  .explanation code {
    background: #f4f4f5;
    padding: 1px 6px;
    border-radius: 4px;
    font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
    font-size: 0.92em;
  }

  .options { list-style: none; padding: 0; margin: 0; }
  .options li {
    padding: 10px 14px;
    margin: 6px 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    transition: background 0.1s, border-color 0.1s;
  }
  .options li:hover:not(.locked) { background: #f4f4f5; }
  .options li.selected { border-color: var(--primary); background: #eff6ff; }
  .options li.locked { cursor: default; }
  .options li.correct-option { border-color: var(--correct); background: var(--correct-bg); }
  .options li.wrong-option { border-color: var(--wrong); background: var(--wrong-bg); }
  .options li.wrong-option .option-text { text-decoration: line-through; }
  .options input[type=radio] { margin-top: 4px; }
  .option-letter { font-weight: 600; color: var(--muted); min-width: 18px; }
  .options li.correct-option .option-letter { color: var(--correct); }
  .options li.wrong-option .option-letter { color: var(--wrong); }
  .option-text { flex: 1; word-break: break-word; }
  .verdict {
    margin-left: auto;
    font-size: 12px;
    font-weight: 600;
  }
  .verdict.correct { color: var(--correct); }
  .verdict.wrong { color: var(--wrong); }

  .explanation {
    display: none;
    margin-top: 14px;
    padding: 12px 14px;
    background: var(--explanation-bg);
    border-left: 3px solid var(--primary);
    border-radius: 0 6px 6px 0;
    font-size: 13px;
  }
  .explanation.show { display: block; }
  .explanation .label {
    font-weight: 700;
    margin-bottom: 4px;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .explanation .source-ref {
    display: block;
    margin-top: 8px;
    font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
    font-size: 11.5px;
    color: var(--muted);
    word-break: break-all;
  }

  .submit-bar {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: 16px;
    max-width: 820px;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
  }
  .progress { font-size: 13px; color: var(--muted); }
  button.submit {
    background: var(--primary);
    color: white;
    border: none;
    padding: 9px 22px;
    font-size: 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
  }
  button.submit:disabled { opacity: 0.45; cursor: not-allowed; }
  button.submit:hover:not(:disabled) { background: var(--primary-hover); }

  @media (max-width: 600px) {
    body { padding: 16px 12px 110px; }
    .question-card { padding: 14px 14px; }
    header h1 { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1 id="exam-title">通用 CS 练习</h1>
    <div class="meta" id="exam-meta"></div>
  </header>

  <div class="result-card" id="result-card">
    <h2>测验结果</h2>
    <div class="score" id="result-score">— / —</div>
    <div class="breakdown" id="result-breakdown"></div>
  </div>

  <div id="questions-root"></div>
</div>

<div class="submit-bar">
  <div class="progress" id="progress">已作答 0 / 0</div>
  <button class="submit" id="submit-btn" disabled>提交答案</button>
</div>

        "Storage 端用 username + password 等认证手段验证 leader 身份",
        "引入单调递增的 **fencing token**: coordinator 颁发租约时附带递增 token, leader 写入必带 token, storage 记录已见最大 token 并拒收任何 `token < max_seen` 的请求 — 即使旧 leader 苏醒, 它持有的 token 已被新 leader 的更大 token 屏蔽"
      ],
      "correct": 3,
      "explanation": "Martin Kleppmann 《DDIA》ch8 详述: GC pause / 进程 stall 长度无界 (尤其 JVM 大堆), 单靠租约时长无法兜底。Fencing token 把「时间正确性」转化为「序号单调性」, storage 侧做一次比较即可拒绝过期请求。这也是 Chubby / etcd / ZooKeeper 客户端文档强调「lease + fencing token 一起用」的根本原因。",
      "source_ref": null
    },
    {
      "category": "general-cs",
      "subcategory": "system-design",
      "question": "关于消息系统的 at-least-once 投递语义, 以下哪项是**消费者**必须承担的责任?",
      "options": [
        "Broker 会自动保证每条消息恰好被处理一次 (exactly-once), 消费者无需做特殊处理",
        "必须使用同步 commit, 否则违反 at-least-once",
        "消费者需要实现幂等或显式去重 (例如按 message-id dedupe), 因为 broker 在 commit 失败 / rebalance / 网络抖动时会重投同一条消息",
        "at-least-once 与 at-most-once 在投递保证上等价, 由消费者自由选择"
      ],
      "correct": 2,
      "explanation": "at-least-once 保证不丢, 但允许重复 (消费者 commit 前崩溃或网络抖动 ⇒ 重投递)。把「恰好一次效果」推回应用层 — 要么副作用天然幂等, 要么基于 message-id / 业务键去重。同步 commit 只是一种实现细节, 不是 at-least-once 的定义。",
      "source_ref": null
    }
  ]
}</script>
<script>
(function () {
  "use strict";

  const dataEl = document.getElementById('exam-data');
  const exam = JSON.parse(dataEl.textContent);
  const root = document.getElementById('questions-root');
  const titleEl = document.getElementById('exam-title');
  const metaEl = document.getElementById('exam-meta');
  const progressEl = document.getElementById('progress');
  const submitBtn = document.getElementById('submit-btn');
  const resultCard = document.getElementById('result-card');
  const resultScore = document.getElementById('result-score');
  const resultBreakdown = document.getElementById('result-breakdown');

  const total = exam.questions.length;
  const userAnswers = new Array(total).fill(null);
  let submitted = false;

  titleEl.textContent = exam.title || '通用 CS 练习';
  metaEl.textContent = '生成于 ' + (exam.generated_at || '') + ' · 共 ' + total + ' 题 · 提交前可自由修改答案';
  progressEl.textContent = '已作答 0 / ' + total;

  function escapeHTML(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  // Render `text` with backtick-wrapped segments converted to <code>. Everything else is escaped.
  function renderInlineCode(text) {
    if (text == null) return '';
    const parts = String(text).split(/(`[^`]+`)/g);
    return parts.map(function (part) {
      if (part.length >= 2 && part[0] === '`' && part[part.length - 1] === '`') {
        return '<code>' + escapeHTML(part.slice(1, -1)) + '</code>';
      }
      return escapeHTML(part);
    }).join('');
  }

  exam.questions.forEach(function (q, idx) {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = 'q-' + idx;

    const isKB = q.category === 'knowledge-base';
    const tagClass = isKB ? 'kb' : 'cs';
    const tagText = isKB ? '知识库' : '通用 CS';
    const subText = q.subcategory ? ' · ' + escapeHTML(q.subcategory) : '';

    let optionsHTML = '';
    q.options.forEach(function (opt, i) {
      optionsHTML += ''
        + '<li data-idx="' + i + '">'
        +   '<input type="radio" name="q-' + idx + '" value="' + i + '" id="q-' + idx + '-opt-' + i + '">'
        +   '<span class="option-letter">' + String.fromCharCode(65 + i) + '.</span>'
        +   '<label class="option-text" for="q-' + idx + '-opt-' + i + '">' + renderInlineCode(opt) + '</label>'
        +   '<span class="verdict" data-verdict-for="' + i + '"></span>'
        + '</li>';
    });

    const explanationHTML = ''
      + '<div class="explanation" id="exp-' + idx + '">'
      +   '<div class="label">解析</div>'
      +   '<div class="exp-body">' + renderInlineCode(q.explanation) + '</div>'
      +   (q.source_ref ? '<span class="source-ref">来源:' + escapeHTML(q.source_ref) + '</span>' : '')
      + '</div>';

    card.innerHTML = ''
      + '<div class="question-header">'
      +   '<span class="tag ' + tagClass + '">' + tagText + '</span>'
      +   '<span class="question-number">第 ' + (idx + 1) + ' 题</span>'
      +   '<span>' + subText + '</span>'
      + '</div>'
      + '<div class="question-text">' + renderInlineCode(q.question) + '</div>'
      + '<ul class="options">' + optionsHTML + '</ul>'
      + explanationHTML;

    root.appendChild(card);

    card.querySelectorAll('.options li').forEach(function (li) {
      li.addEventListener('click', function () {
        if (submitted) return;
        const input = li.querySelector('input[type=radio]');
        if (!input) return;
        input.checked = true;
        userAnswers[idx] = parseInt(input.value, 10);
        card.querySelectorAll('.options li').forEach(function (other) {
          other.classList.remove('selected');
        });
        li.classList.add('selected');
        updateProgress();
      });
    });
  });

  function updateProgress() {
    const answered = userAnswers.filter(function (a) { return a !== null; }).length;
    progressEl.textContent = '已作答 ' + answered + ' / ' + total;
    submitBtn.disabled = answered !== total;
  }

  submitBtn.addEventListener('click', function () {
    if (submitted) return;
    submitted = true;
    submitBtn.disabled = true;
    submitBtn.textContent = '已提交';

    let correctCount = 0;
    let kbCorrect = 0, kbTotal = 0, csCorrect = 0, csTotal = 0;

    exam.questions.forEach(function (q, idx) {
      const card = document.getElementById('q-' + idx);
      const userAns = userAnswers[idx];
      const isCorrect = userAns === q.correct;
      if (isCorrect) correctCount++;
      if (q.category === 'knowledge-base') {
        kbTotal++;
        if (isCorrect) kbCorrect++;
      } else {
        csTotal++;
        if (isCorrect) csCorrect++;
      }

      card.classList.add(isCorrect ? 'correct' : 'wrong');
      card.querySelectorAll('.options li').forEach(function (li) {
        const i = parseInt(li.getAttribute('data-idx'), 10);
        const input = li.querySelector('input[type=radio]');
        if (input) input.disabled = true;
        li.classList.add('locked');
        const verdict = li.querySelector('.verdict');
        if (i === q.correct) {
          li.classList.add('correct-option');
          if (verdict) {
            verdict.classList.add('correct');
            verdict.textContent = '✓ 正确答案';
          }
        }
        if (i === userAns && !isCorrect) {
          li.classList.add('wrong-option');
          if (verdict) {
            verdict.classList.add('wrong');
            verdict.textContent = '✗ 你的选择';
          }
        }
      });

      document.getElementById('exp-' + idx).classList.add('show');
    });

    resultScore.textContent = correctCount + ' / ' + total;
    const ratio = correctCount / total;
    if (ratio >= 0.8) resultScore.classList.add('high');
    else if (ratio < 0.5) resultScore.classList.add('low');

    const breakdownParts = [];
    if (kbTotal > 0) breakdownParts.push('知识库 ' + kbCorrect + '/' + kbTotal);
    if (csTotal > 0) breakdownParts.push('通用 CS ' + csCorrect + '/' + csTotal);
    resultBreakdown.textContent = breakdownParts.join(' · ');

    resultCard.classList.add('show');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();
</script>
</body>
</html>
